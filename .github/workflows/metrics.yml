name: Metrics
on:
  # Schedule daily updates
  schedule: [{cron: "0 0 * * *"}]
  # Allow running manually from the Actions tab
  workflow_dispatch:
  # Run on every push to main/master
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Your GitHub token (we will set this up as a secret)
          token: ${{ secrets.METRICS_TOKEN }}
          
          # Basic options
          user: LabibIshrak
          template: classic
          base: "" # Hides the default header to keep things minimal
          config_timezone: Asia/Dhaka
          
          # ----------------------------------------------------
          # ISOCALENDAR PLUGIN (Looks like GitHub commit graph!)
          # ----------------------------------------------------
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # ----------------------------------------------------
          # LANGUAGES PLUGIN
          # ----------------------------------------------------
          plugin_languages: yes
          plugin_languages_indepth: yes 
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
