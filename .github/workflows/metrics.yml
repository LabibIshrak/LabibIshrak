name: Metrics
on:
  # Schedule daily updates
  schedule: [{cron: "0 0 * * *"}]
  # Allow running manually from the Actions tab
  workflow_dispatch:
  # Run on every push to main/master
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Your GitHub token (we will set this up as a secret)
          token: ${{ secrets.METRICS_TOKEN }}
          
          # Basic options
          user: LabibIshrak
          template: classic
          base: "" # Hides the default header to keep things minimal
          config_timezone: Asia/Dhaka
          config_display: large
          config_padding: 6%, 10%

          # ----------------------------------------------------
          # LANGUAGES PLUGIN
          # ----------------------------------------------------
          plugin_languages: yes
          plugin_languages_indepth: yes 
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_colors: "0:#F18E33, 1:#E76F00, 2:#61DAFB, 3:#663399, 4:#89E051, 5:#DEA584, 6:#E34C26, 7:#3178C6"

          # ----------------------------------------------------
          # CUSTOM STYLING
          # ----------------------------------------------------
          extras_css: |
            * { color: #cdd9e5; }
            h2, h3 { color: #ff6e96 !important; font-weight: 600 !important; }
            h2 svg, h3 svg { fill: #ff6e96 !important; }
            small { color: #768390 !important; }
            .field.language.details small { color: #8b949e !important; }
            svg.bar rect[fill="#d1d5da"] { fill: #30363d !important; }
